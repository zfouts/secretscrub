name: Missed credential
description: A credential format got through undetected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A format that gets through is more serious than one that over-fires, so
        thank you for reporting it.

        **Describe the format, never the credential.** The provider, the prefix,
        the length and the character set are what a rule is built from. A real
        key adds nothing and cannot be unpublished.

        A format the detector has never seen is an ordinary bug and belongs
        here. A credential that this tool claimed to have **redacted** and did
        not is a vulnerability: report that through
        [private vulnerability reporting](https://github.com/zfouts/secretscrub/security/advisories/new).

        Two things that are known limits rather than bugs, listed in
        [docs/auditing.md](https://github.com/zfouts/secretscrub/blob/main/docs/auditing.md#known-limits):
        a PEM certificate is public material and scores below the default cut,
        and an encoding is unwrapped one level only.

  - type: input
    id: provider
    attributes:
      label: Provider and credential type
      placeholder: Acme Corp, project API key
    validations:
      required: true

  - type: textarea
    id: format
    attributes:
      label: The format
      description: >-
        Prefix, total length, character set, and anything fixed about it. A link
        to the provider's documentation is ideal.
      placeholder: |
        Prefix:    acme_
        Length:    5 + 32 = 37
        Charset:   [A-Za-z0-9] after the prefix
        Docs:      https://docs.acme.example/api-keys
    validations:
      required: true

  - type: input
    id: synthetic
    attributes:
      label: A synthetic example
      description: >-
        Shaped like the real thing and NOT the real thing. Every sample in this
        repository's test suite is fabricated the same way.
      placeholder: acme_aB3xY9zQaB3xY9zQaB3xY9zQaB3xY9zQ
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did it get through
      multiple: true
      options:
        - Scanning a file or directory
        - Redacting a captured API payload (RedactTree)
        - Redacting a document (RedactText)
        - Inside a larger string (RedactInline)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: secretscrub v0.0.1
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The example above is synthetic. No real credential appears in this issue.
          required: true
        - label: >-
            I checked `secretscrub -rules` and this format is not already
            listed under another name.
          required: false
